[project]
name = "flow2api"
version = "0.1.0"
description = "OpenAI-compatible API service for Google Flow"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
  "aiosqlite==0.20.0",
  "bcrypt==4.2.1",
  "boto3>=1.35,<2.0",
  "cryptography>=44,<47",
  "curl-cffi==0.7.3",
  "fastapi==0.119.0",
  "httpx>=0.27.0,<1.0.0",
  "nodriver>=0.48.0",
  "pillow==12.2.0",
  "playwright>=1.40.0",
  "prometheus-client==0.22.1",
  "psycopg[binary,pool]>=3.2,<4.0",
  "pydantic==2.10.4",
  "python-dateutil==2.8.2",
  "python-multipart==0.0.20",
  "redis[hiredis]>=5.2,<7.0",
  "tomli==2.2.1",
  "uvicorn[standard]==0.32.1",
]

[project.scripts]
setup = "src.local_runner:setup"
flow2api = "main:main"

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
]
agent-gateway = [
  "fastapi==0.119.0",
  "httpx==0.28.1",
  "pyjwt[crypto]==2.10.1",
  "pydantic==2.10.4",
  "uvicorn[standard]==0.32.1",
  "websockets==14.1",
]

[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
