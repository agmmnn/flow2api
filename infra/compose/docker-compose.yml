# Flow2API app only. For Cloudflare Tunnel + agent gateway, merge:
#   docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.agent.yml up -d
#
# Headed:           docker compose -f infra/compose/docker-compose.headed.yml up -d
# Local + frontend: docker compose -f infra/compose/docker-compose.local.yml up -d
# WARP:             docker compose -f infra/compose/docker-compose.proxy.yml up -d
#
# flow2api is built from this repo (Vite `apps/admin-web/` → `/app/apps/api/static`). Prebuilt
# `ghcr.io/.../flow2api:latest` is often the older static admin; use the build below for the current UI.
# To force upstream image only: remove `build:` and set `image: ghcr.io/thesmallhancat/flow2api:latest`.

services:
  flow2api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: flow2api:local
    container_name: flow2api
    ports:
      - "38000:8000"
    volumes:
      - ../../.runtime/data:/app/.runtime/data
      - ../../.runtime/tmp:/app/.runtime/tmp
      - ../../config/setting.toml:/app/config/setting.toml
    environment:
      - PYTHONUNBUFFERED=1
      - FLOW2API_API_ONLY_HOST=${FLOW2API_API_ONLY_HOST:-flow-api.prismacreative.online}
      - FLOW2API_REDIS_URL=${FLOW2API_REDIS_URL:-redis://redis:6379/0}
      - FLOW2API_REDIS_MODE=${FLOW2API_REDIS_MODE:-shadow}
      - FLOW2API_DATABASE_BACKEND=${FLOW2API_DATABASE_BACKEND:-sqlite}
      - FLOW2API_DATABASE_URL=${FLOW2API_DATABASE_URL:-}
      - FLOW2API_DB_SCHEMA=${FLOW2API_DB_SCHEMA:-flow2api}
      - FLOW2API_REQUIRE_CUTOVER_MARKER=${FLOW2API_REQUIRE_CUTOVER_MARKER:-true}
    restart: unless-stopped
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: flow2api-redis
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory", "384mb", "--maxmemory-policy", "noeviction"]
    mem_limit: 512m
    volumes:
      - flow2api-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: flow2api-cloudflared
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${TUNNEL_TOKEN}
    depends_on:
      - flow2api
    restart: unless-stopped

volumes:
  flow2api-redis-data:
