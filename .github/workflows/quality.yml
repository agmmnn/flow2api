name: Quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
      - name: Install Python
        run: uv python install
      - name: Install locked dependencies
        run: uv sync --frozen
      - name: Ruff correctness checks
        run: uv run ruff check .
      - name: Pyright basic checks
        run: uv run pyright
      - name: Backend tests
        run: uv run pytest -q

  frontend-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - name: Install locked dependencies
        run: bun install --frozen-lockfile
      - name: Lint, typecheck, and test all workspaces
        run: bun run check
      - name: Build all workspaces
        run: bun run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Compose configurations
        run: |
          cp .env.headed.example .env
          docker compose -f infra/compose/docker-compose.yml config --quiet
          docker compose -f infra/compose/docker-compose.yml -f infra/compose/docker-compose.agent.yml config --quiet
          docker compose -f infra/compose/docker-compose.headed.yml config --quiet
          docker compose -f infra/compose/docker-compose.local.yml config --quiet
          docker compose -f infra/compose/docker-compose.proxy.yml config --quiet
